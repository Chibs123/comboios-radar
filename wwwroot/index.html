<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Train Radar — Portugal</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0d13;
      font-family: 'Plus Jakarta Sans', sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      overscroll-behavior: none;
    }
    #map { width: 100%; height: 100%; }
    #map canvas { filter: brightness(1.18) contrast(1.06); }

    /* --- LOADER --- */
    #appLoader {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: radial-gradient(circle at center, #0f172a 0%, #06080e 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px; z-index: 9999; transition: opacity 0.6s ease, visibility 0.6s ease;
    }
    #appLoader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .radar-spinner-container { position: relative; width: 76px; height: 76px; display: flex; align-items: center; justify-content: center; }
    .radar-pulse-ring { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 1.5px solid rgba(56, 189, 248, 0.45); animation: radarRipples 2s infinite ease-out; }
    .radar-spinner { width: 50px; height: 50px; border: 2.5px solid rgba(255, 255, 255, 0.08); border-top-color: #38bdf8; border-right-color: #38bdf8; border-radius: 50%; animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite; box-shadow: 0 0 20px rgba(56, 189, 248, 0.4); }
    .radar-core-dot { position: absolute; width: 8px; height: 8px; background-color: #ffffff; border-radius: 50%; box-shadow: 0 0 12px #ffffff; }
    .loader-brand { font-family: 'JetBrains Mono', monospace; font-size: 1.15rem; font-weight: 800; letter-spacing: 0.32em; text-transform: uppercase; color: #ffffff; text-align: center; animation: neonPulse 2.2s infinite ease-in-out; user-select: none; }
    .loader-subtext { font-family: 'JetBrains Mono', monospace; font-size: 0.70rem; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #64748b; margin-top: -12px; }

    @keyframes neonPulse { 0%, 100% { text-shadow: 0 0 4px rgba(255, 255, 255, 0.8); opacity: 0.85; } 50% { text-shadow: 0 0 20px rgba(56, 189, 248, 0.9); opacity: 1; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes radarRipples { 0% { transform: scale(0.65); opacity: 0.95; } 100% { transform: scale(1.7); opacity: 0; } }

    /* --- SIDEBAR BASE (DESKTOP) --- */
    .sheet-handle { display: none; }
    .sidebar-panel {
      position: absolute; top: 18px; left: 18px; z-index: 10; width: 310px;
      max-height: calc(100vh - 36px); display: flex; flex-direction: column; gap: 12px;
      background: rgba(14, 18, 27, 0.92); border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px; padding: 16px; backdrop-filter: blur(14px); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.7);
    }
    
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .brand-title { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: #ffffff; user-select: none; pointer-events: none; }
    
    .btn-collapse {
      width: 30px; height: 30px; flex: none; border-radius: 50%; cursor: pointer;
      background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); 
      color: #cbd5e1; display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease;
    }
    .btn-collapse:hover { background: rgba(255, 255, 255, 0.15); }
    .btn-collapse svg { transition: transform 0.3s ease; }
    .sidebar-panel.collapsed .btn-collapse svg { transform: rotate(180deg); }

    @media (min-width: 769px) {
      .sidebar-panel.collapsed .live-status,
      .sidebar-panel.collapsed .list-head,
      .sidebar-panel.collapsed .train-list { display: none; }
    }

    .operator-toggle { display: flex; background: rgba(0, 0, 0, 0.5); padding: 4px; border-radius: 12px; gap: 6px; }
    .btn-op { flex: 1; border: none; background: transparent; color: #94a3b8; font-size: 0.76rem; font-weight: 700; padding: 7px 0; border-radius: 8px; cursor: pointer; transition: all 0.2s; }
    .btn-op.active.fertagus { background: #10b981; color: #032514; }
    .btn-op.active.cm { background: #facc15; color: #1a1400; }
    .btn-op.active.cp { background: #0284c7; color: #ffffff; }

    .live-status { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; font-weight: 600; color: #94a3b8; line-height: 1.5; }
    .live-status b { color: #10b981; font-size: 0.85rem; }

    .list-head { white-space: nowrap; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #94a3b8; }
    .list-head input, .list-head select { background: rgba(0, 0, 0, 0.45); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; color: #f8fafc; font-size: 0.72rem; padding: 5px 8px; outline: none; font-family: 'Plus Jakarta Sans', sans-serif; letter-spacing: 0; text-transform: none; }
    .list-head input { width: 84px; flex: 1; min-width: 60px; }
    .list-head input:focus, .list-head select:focus { border-color: #38bdf8; }

    .train-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; margin: 0 -6px; padding: 0 6px; scrollbar-width: thin; scrollbar-color: rgba(255, 255, 255, 0.2) transparent; }
    .train-row { display: flex; align-items: center; gap: 9px; padding: 8px 8px; border-radius: 10px; cursor: pointer; }
    .train-row:hover { background: rgba(255, 255, 255, 0.07); }
    .train-row.parked { opacity: 0.55; }
    .tr-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
    .tr-id { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 0.8rem; color: #fff; min-width: 46px; }
    .tr-main { flex: 1; min-width: 0; }
    .tr-route { font-size: 0.76rem; font-weight: 700; color: #e2e8f0; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tr-sub { font-size: 0.66rem; color: #94a3b8; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .tr-time { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; font-weight: 700; color: #cbd5e1; flex: none; }
    .tr-badge { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; font-weight: 700; padding: 2px 6px; border-radius: 6px; flex: none; }
    .tr-empty { font-size: 0.74rem; color: #64748b; padding: 10px 4px; }

    .maplibregl-popup-content { background: rgba(14, 20, 32, 0.95) !important; border: 1px solid rgba(255, 255, 255, 0.15) !important; border-radius: 8px !important; color: #f8fafc !important; padding: 10px 14px !important; }
    .maplibregl-popup-tip { border-top-color: rgba(14, 20, 32, 0.95) !important; }

    /* --- ADAPTAÇÃO BOTTOM SHEET (TELEMÓVEL) --- */
    @media (max-width: 768px) {
      .sheet-handle {
        display: block; width: 38px; height: 4px; border-radius: 2px;
        background: rgba(255, 255, 255, 0.25); margin: 0 auto 6px auto; flex: none;
      }
      
      /* --- ALTERAÇÕES PARA ESCONDER BOTÃO E CENTRAR TÍTULO --- */
      .brand-row { 
        padding-bottom: 2px; 
        justify-content: center; /* Centra o conteúdo */
      }
      .btn-collapse { display: none; } /* Esconde a seta no telemóvel */

      .sidebar-panel { 
        top: auto; bottom: 0; left: 0; right: 0; width: 100%; 
        height: 65vh; max-height: none; padding: 12px 16px max(env(safe-area-inset-bottom, 20px), 20px) 16px; 
        border-radius: 24px 24px 0 0; border: none; border-top: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(11, 15, 23, 0.95); box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.6);
        transition: height 0.35s cubic-bezier(0.2, 1, 0.3, 1);
        overflow: hidden;
        touch-action: none; /* Previne scroll default em áreas de arrasto */
      }
      .sidebar-panel.collapsed { height: 165px; }
      
      .sidebar-panel.collapsed .list-head,
      .sidebar-panel.collapsed .train-list { opacity: 0; pointer-events: none; margin-top: 20px; }
      .list-head, .train-list { opacity: 1; transition: all 0.3s ease; }
      
      /* Liberta o scroll na lista */
      .train-list { touch-action: auto; overscroll-behavior: contain; }

      .maplibregl-ctrl-bottom-right { transition: transform 0.35s cubic-bezier(0.2, 1, 0.3, 1); }
      body.sheet-open .maplibregl-ctrl-bottom-right { transform: translateY(calc(-65vh + 20px)); }
      body.sheet-collapsed .maplibregl-ctrl-bottom-right { transform: translateY(-165px); }
    }
  </style>
  
  <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
</head>

  <script>
    const API_BASE = location.protocol === 'file:' ? 'http://localhost:5000' : '';
    let activeOperator = "cp";

    const PT_BOUNDS = [[-9.8, 36.8], [-6.0, 42.3]];   // Portugal continental

    // Deixa espaço para o painel lateral no PC, e para a gaveta no fundo em telemóveis
    const paddingPT = () => {
      const mobile = window.innerWidth <= 768;
      const painelEl = document.getElementById('painelGlobal');
      const collapsed = painelEl ? painelEl.classList.contains('collapsed') : true;
      
      return { 
        top: 30, 
        right: 30, 
        left: mobile ? 30 : 340, 
        bottom: mobile ? (collapsed ? 185 : window.innerHeight * 0.65 + 20) : 30 
      };
    };

    const map = new maplibregl.Map({
      container: 'map',
      style: 'https://tiles.openfreemap.org/styles/dark',
      bounds: PT_BOUNDS,
      fitBoundsOptions: { padding: paddingPT() },
      minZoom: 5,
      maxZoom: 16,
      maxBounds: [[-22, 33], [4, 47]]
    });

    let popupAtual = null;
    function novoPopup(opcoes) {
      if (popupAtual) popupAtual.remove();
      popupAtual = new maplibregl.Popup({ closeButton: false, ...opcoes });
      popupAtual.on('close', () => { SEGUIR = null; SELECIONADO = null; limparRota(); });
      return popupAtual;
    }

    let SEGUIR = null;
    let SELECIONADO = null;
    function seguirComboio(op, id, btn) {
      const igual = SEGUIR && SEGUIR.op === op && SEGUIR.id === id;
      SEGUIR = igual ? null : { op, id };
      if (btn) btn.textContent = SEGUIR ? 'A seguir ✓' : 'Seguir';
    }
    map.on('dragstart', () => { SEGUIR = null; });

    function offsetMetros() {
      const z = map.getZoom();
      return z >= 11 ? 7 * 78271.5 * Math.cos(38.7 * Math.PI / 180) / Math.pow(2, z) : 0;
    }
    
    function deslocarLateral(pos, bearing, m) {
      if (!m) return pos;
      const r = (bearing + 90) * Math.PI / 180;
      return [pos[0] + (m * Math.sin(r)) / (111320 * Math.cos(pos[1] * Math.PI / 180)), pos[1] + (m * Math.cos(r)) / 111320];
    }

    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');

    function esconderLoader() {
      const loader = document.getElementById("appLoader");
      if (loader && !loader.classList.contains("hidden")) loader.classList.add("hidden");
    }

        map.setLayerZoomRange('railway_minor', 1, 24);
      }
      if (map.getLayer('boundary_country')) map.setLayoutProperty('boundary_country', 'visibility', 'none');

      map.addSource('fronteira-terrestre-pt', {
        type: 'geojson',
        data: {
          type: 'Feature',
          geometry: {
            type: 'LineString',

              [-8.570, 42.062], [-8.502, 42.082], [-8.420, 42.100], [-8.356, 42.115], 
              [-8.275, 42.124], [-8.220, 42.140], [-8.176, 42.154], 
              [-8.160, 42.110], [-8.145, 42.068], [-8.132, 41.995], [-8.115, 41.960], 
              [-8.070, 41.945], [-8.032, 41.932], [-7.985, 41.921], [-7.940, 41.895], 
              [-7.892, 41.855], [-7.840, 41.870], [-7.785, 41.878], [-7.730, 41.865], 
              [-7.682, 41.854], [-7.610, 41.820], [-7.542, 41.792], [-7.468, 41.742], 
              [-7.410, 41.765], [-7.352, 41.815], [-7.295, 41.860], [-7.245, 41.892], 
              [-7.190, 41.885], [-7.142, 41.875], [-7.050, 41.860], [-6.952, 41.854], 
              [-6.880, 41.875], [-6.812, 41.895], [-6.755, 41.872], [-6.690, 41.855], 
              [-6.625, 41.845], [-6.570, 41.815], [-6.512, 41.782], [-6.465, 41.740], 
              [-6.425, 41.695], [-6.405, 41.640], [-6.385, 41.585], 
              [-6.280, 41.545], [-6.195, 41.512], [-6.210, 41.465], [-6.265, 41.425], 
              [-6.320, 41.385], [-6.385, 41.352], [-6.460, 41.320], [-6.542, 41.285], 
              [-6.615, 41.235], [-6.685, 41.185], [-6.715, 41.160], [-6.745, 41.142], 
              [-6.785, 41.085], [-6.825, 41.025], [-6.865, 40.990], [-6.895, 40.952], 
              [-6.875, 40.900], [-6.852, 40.852], [-6.835, 40.730], [-6.832, 40.608], 
              [-6.870, 40.545], [-6.912, 40.485], [-6.950, 40.415], [-6.985, 40.352], 
              [-7.000, 40.265], [-7.012, 40.185], [-7.005, 40.090], [-6.995, 39.952], 
              [-7.040, 39.895], [-7.085, 39.845], [-7.120, 39.750], [-7.152, 39.662], 
              [-7.215, 39.645], [-7.285, 39.625], [-7.355, 39.605], [-7.425, 39.585], 
              [-7.480, 39.545], [-7.532, 39.502], [-7.480, 39.440], [-7.425, 39.385], 
              [-7.385, 39.250], [-7.352, 39.122], [-7.250, 39.050], [-7.152, 38.982], 
              [-7.105, 38.930], [-7.062, 38.882], [-7.120, 38.765], [-7.185, 38.652], 
              [-7.235, 38.565], [-7.285, 38.485], [-7.270, 38.445], [-7.252, 38.412],

            ]
          }
        }
      });

      map.addLayer({
        id: 'fronteira-terrestre-line', type: 'line', source: 'fronteira-terrestre-pt',
        layout: { 'line-join': 'round', 'line-cap': 'round' },
        paint: { 'line-color': '#e2e8f0', 'line-width': 1.4, 'line-opacity': 0.65, 'line-dasharray': [4, 3] }
      });

        id: 'stations-hitbox', minzoom: 8, type: 'circle', source: 'stations', paint: { 'circle-radius': 16, 'circle-opacity': 0 }
      });

      map.addLayer({
        id: 'stations-ring', minzoom: 8, type: 'circle', source: 'stations',
        paint: {
          'circle-color': '#090d16',
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 2.5, 11, 4.5, 16, 6],
          'circle-stroke-width': 2,
          'circle-stroke-color': ['case', ['==', ['get', 'operator'], 'cp'], '#0284c7', '#22c55e']
        }
      });

      map.addLayer({
        id: 'stations-label', type: 'symbol', source: 'stations', minzoom: 10,
        layout: { 'text-field': ['get', 'name'], 'text-size': 11, 'text-offset': [0, 1.2], 'text-anchor': 'top', 'text-allow-overlap': false },
        paint: { 'text-color': '#cbd5e1', 'text-halo-color': '#090d16', 'text-halo-width': 2 }
      });

      map.on('mouseenter', 'stations-hitbox', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'stations-hitbox', () => { map.getCanvas().style.cursor = ''; });
      map.on('click', 'stations-hitbox', (e) => {
        const coords = e.features[0].geometry.coordinates.slice();
        const { name, code } = e.features[0].properties;

        novoPopup({ offset: 8 }).setLngLat(coords).setHTML(`
            <div style="font-size:0.72rem; text-transform:uppercase; color:#94a3b8; font-weight:700;">Estação</div>
            <div style="font-size:1.05rem; font-weight:800; color:#fff;">${esc(name)}</div>
            <div style="font-size:0.7rem; color:#64748b; font-family:'JetBrains Mono',monospace;">ID: ${esc(code)}</div>
        `).addTo(map);
      });

      atualizarEstadoPainel();
      iniciarRadarFertagus();
      iniciarRadarCP();
      iniciarRadarCM();
      await carregarEstacoes();
      esconderLoader();
    });

    const FRAME_MS = 1000 / 30;

    const FT = {
      line: null, coords: null, cum: null, total: 0,
      km: {}, stations: {}, trips: [], ready: false, error: false,
      rafId: null, last: 0, count: -1, parados: 0, nFeat: -1, ultimas: [], angles: new Map(),
      baseEpochSeconds: 0, basePerf: 0
    };

    function prepararLinhaFT(coords) {
      const cum = [0];
      for (let i = 1; i < coords.length; i++) {
        cum.push(cum[i - 1] + turf.distance(coords[i - 1], coords[i], { units: 'kilometers' }));
      }
      FT.coords = coords; FT.cum = cum; FT.total = cum[cum.length - 1];
    }

    function posNaLinha(km) {
      const { coords, cum } = FT;
      km = Math.max(0, Math.min(FT.total, km));
      let lo = 0, hi = cum.length - 1;
      while (hi - lo > 1) {
        const mid = (lo + hi) >> 1;
        if (cum[mid] <= km) lo = mid; else hi = mid;
      }
      const seg = cum[hi] - cum[lo];
      const f = seg > 0 ? (km - cum[lo]) / seg : 0;
      return [coords[lo][0] + (coords[hi][0] - coords[lo][0]) * f, coords[lo][1] + (coords[hi][1] - coords[lo][1]) * f];
    }

    function rumoGraus(a, b) {
      const k = Math.cos(a[1] * Math.PI / 180);
      return (Math.atan2((b[0] - a[0]) * k, b[1] - a[1]) * 180 / Math.PI + 360) % 360;
    }

    function suavizarAngulo(atual, alvo, k) {
      const d = ((alvo - atual + 540) % 360) - 180;
      return (atual + d * k + 360) % 360;
    }

    function sincronizarRelogioLisboa() {
      const now = new Date();
      const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/Lisbon', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false }).formatToParts(now);
      const g = t => Number(p.find(x => x.type === t).value);
      const secs = (g('hour') % 24) * 3600 + g('minute') * 60 + g('second') + (now.getMilliseconds() / 1000);
      FT.baseEpochSeconds = secs;
      FT.basePerf = performance.now();
    }

    function agoraLisboaFluido() {
      return (FT.baseEpochSeconds + (performance.now() - FT.basePerf) / 1000) % 86400;
    }

    function fmtHora(secs) {
      const s = ((secs % 86400) + 86400) % 86400;
      return String(Math.floor(s / 3600)).padStart(2, '0') + ':' + String(Math.floor((s % 3600) / 60)).padStart(2, '0');
    }

    function criarIconeSeta() {
      if (map.hasImage('train-arrow')) return;
      const size = 48, c = document.createElement('canvas'), ctx = c.getContext('2d');
      c.width = c.height = size; ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.moveTo(size / 2, 8); ctx.lineTo(size / 2 + 9, size / 2 + 9); ctx.lineTo(size / 2, size / 2 + 4); ctx.lineTo(size / 2 - 9, size / 2 + 9); ctx.closePath(); ctx.fill();
      map.addImage('train-arrow', ctx.getImageData(0, 0, size, size));
    }

    function adicionarCamadasRota() {

        paint: { 'text-color': '#fdba74', 'text-halo-color': '#090d16', 'text-halo-width': 2 }
      });

    function limparRota() {
      const l = map.getSource('rota-linha'), p = map.getSource('rota-paragens');
      if (!l || !p) return;
      const vazio = { type: 'FeatureCollection', features: [] };
      l.setData(vazio); p.setData(vazio);
      FT.rotaAtiva = false; FT.rotaChave = null;
      CP.rotaStops = null; CP.rotaPath = null; CP.rotaAt = null; CP.rotaChave = null;
    }

    function atualizarRota(trip, s) {
      const l = map.getSource('rota-linha'), p = map.getSource('rota-paragens');
      if (!l || !p) return;
      if (!trip || !s || !s.next || !FT.line) { if (FT.rotaAtiva) limparRota(); return; }
      const stops = trip.stops, idx = stops.indexOf(s.next);
      
      const kmInicio = s.km;
      const kmFim = stops[stops.length - 1].km;
      const minKm = Math.min(kmInicio, kmFim), maxKm = Math.max(kmInicio, kmFim);
      
      try {
        const slicedLine = turf.lineSliceAlong(FT.line, minKm, maxKm, { units: 'kilometers' });
        l.setData(slicedLine);
      } catch (e) { console.error(e); }

      const chave = trip.id + ':' + idx;
      if (FT.rotaChave !== chave) {
        FT.rotaChave = chave;
        p.setData({
          type: 'FeatureCollection',
          features: stops.slice(idx).map(x => ({
            type: 'Feature', geometry: { type: 'Point', coordinates: posNaLinha(x.km) },
            properties: { label: `${FT.stations[x.k].name} ${fmtHora(x.t)}` }
          }))
        });
      }
      FT.rotaAtiva = true;
    }

    function abrirPopupFertagus(p, coords) {
      const occ = p.ocupacao !== undefined && p.ocupacao !== 'null' && p.ocupacao !== '' ? `${Math.round(Number(p.ocupacao))}%` : '—';
      novoPopup({ offset: 14 })
        .setLngLat(coords)
        .setHTML(`
          <div style="font-size:0.72rem; text-transform:uppercase; color:#94a3b8; font-weight:700;">Fertagus · ${p.dir === 'sul' ? 'Sentido Margem Sul' : 'Sentido Lisboa'}</div>
          <div style="font-size:1.05rem; font-weight:800; color:#fff;">Comboio ${esc(p.id)}</div>
          ${p.dest ? `<div style="font-size:0.78rem; color:#cbd5e1;">Destino: <b>${esc(p.dest)}</b></div>` : ''}
          <div style="font-size:0.78rem; color:#cbd5e1;">${esc(p.status)}</div>
          ${p.next ? `<div style="font-size:0.78rem; color:#cbd5e1;">Próxima: <b>${esc(p.next)}</b> às ${esc(p.eta)}</div>` : ''}
          <div style="font-size:0.7rem; color:#64748b; font-family:'JetBrains Mono',monospace;">${p.carruagens || '?'} carruagens · ocupação ${occ}</div>
        <button onclick="seguirComboio('fertagus','${esc(p.id)}',this)" style="margin-top:8px;width:100%;padding:5px 0;border:0;border-radius:6px;background:#38bdf8;color:#06080e;font-weight:700;cursor:pointer">Seguir</button>
`).addTo(map);
      SELECIONADO = { op: 'fertagus', id: String(p.id) };
    }

    async function iniciarRadarFertagus() {
      adicionarCamadasFertagus();
      adicionarCamadasRota();
      sincronizarRelogioLisboa();
      setInterval(sincronizarRelogioLisboa, 60000);
      carregarDadosFertagus();
    }

    async function carregarDadosFertagus() {
      try {
        const [trackRes, schedRes] = await Promise.all([
          fetch(`${API_BASE}/api/tracks/fertagus`),
          fetch(`${API_BASE}/api/trains/fertagus/schedule`)
        ]);
        const track = await trackRes.json();
        const linha = track.type === 'FeatureCollection' ? track.features.find(f => f.geometry && f.geometry.type === 'LineString') : track;
        const sched = await schedRes.json();

        map.getSource('fertagus-track').setData(linha);
        FT.line = turf.lineString(linha.geometry.coordinates);
        prepararLinhaFT(linha.geometry.coordinates);
        FT.stations = sched.stations;

        for (const [k, st] of Object.entries(sched.stations)) {
          const snap = turf.nearestPointOnLine(FT.line, turf.point([st.lon, st.lat]), { units: 'kilometers' });
          FT.km[k] = snap.properties.location;
        }

        FT.trips = sched.trips.map(t => ({
          ...t,
          stops: t.stops.filter(s => FT.km[s.k] !== undefined).map(s => ({ k: s.k, t: s.t, km: FT.km[s.k] }))
        })).filter(t => t.stops.length >= 2);
        FT.trips.forEach(t => { t.destName = FT.stations[t.stops[t.stops.length - 1].k].name; });

        FT.ready = true; FT.error = false;
        iniciarAnimacaoFertagus();
        atualizarEstadoPainel();
      } catch (err) {
        console.error("Erro radar Fertagus:", err);
        FT.error = true; atualizarEstadoPainel();
        setTimeout(carregarDadosFertagus, 10000);
      }
    }

    const FT_PRE_S = 10 * 60;
    const FT_POST_S = 5 * 60;

    function estadoComboio(trip, now) {
      const stops = trip.stops, first = stops[0], last = stops[stops.length - 1];
      for (const off of [-86400, 0, 86400]) {
        const t = now + off;
        if (t < first.t - FT_PRE_S || t > last.t + FT_POST_S) continue;
        if (t < first.t) return { km: first.km, dir: stops[1].km >= first.km ? 1 : -1, estac: true, status: `Parado em ${FT.stations[first.k].name} · parte às ${fmtHora(first.t)}`, next: stops[1], nextT: stops[1].t };
        if (t >= last.t) return { km: last.km, dir: last.km >= stops[stops.length - 2].km ? 1 : -1, estac: true, status: `Chegou a ${FT.stations[last.k].name}`, next: null, nextT: last.t };
        for (let i = 0; i < stops.length - 1; i++) {
          const a = stops[i], b = stops[i + 1];
          if (t < a.t || t > b.t) continue;
          const dwell = Math.min(30, (b.t - a.t) * 0.3);
          const dir = b.km >= a.km ? 1 : -1;
          if (t < a.t + dwell) return { km: a.km, dir, estac: false, status: `Parado em ${FT.stations[a.k].name}`, next: b, nextT: b.t };
          const f = (t - (a.t + dwell)) / (b.t - (a.t + dwell));
          return { km: a.km + (b.km - a.km) * (f * f * (3 - 2 * f)), dir, estac: false, status: `A caminho de ${FT.stations[b.k].name}`, next: b, nextT: b.t };
        }
      }
      return null;
    }

    function animarLoopFertagus(ts) {
      if (!FT.ready || activeOperator !== 'fertagus') return;
      FT.rafId = requestAnimationFrame(animarLoopFertagus);
      if (ts - FT.last < FRAME_MS) return;
      const dt = Math.min(0.25, (ts - FT.last) / 1000);
      FT.last = ts;

      const now = agoraLisboaFluido();
      const features = [];
      let emCirculacao = 0, alvoSeguir = null, selTrip = null, selS = null;

      for (const trip of FT.trips) {
        const s = estadoComboio(trip, now);
        if (!s) continue;
        if (!s.estac) emCirculacao++;
        if (SELECIONADO && SELECIONADO.op === 'fertagus' && SELECIONADO.id === String(trip.id)) { selTrip = trip; selS = s; }

        const pos = posNaLinha(s.km);
        const alvo = rumoGraus(posNaLinha(s.km - 0.05 * s.dir), posNaLinha(s.km + 0.05 * s.dir));
        const prev = FT.angles.get(trip.id);
        const bearing = prev === undefined ? alvo : suavizarAngulo(prev, alvo, 1 - Math.exp(-dt / 0.25));
        FT.angles.set(trip.id, bearing);
        if (SEGUIR && SEGUIR.op === 'fertagus' && SEGUIR.id === String(trip.id)) alvoSeguir = pos;

        features.push({
          type: 'Feature', geometry: { type: 'Point', coordinates: pos },
          properties: { id: String(trip.id), dir: trip.dir, dest: trip.destName, estac: s.estac ? 1 : 0, bearing, carruagens: trip.carruagens, ocupacao: trip.ocupacao === null ? '' : trip.ocupacao, status: s.status, next: s.next ? FT.stations[s.next.k].name : '', eta: s.next ? fmtHora(s.nextT) : '' }
        });
      }

      if ((SELECIONADO && SELECIONADO.op === 'fertagus') || FT.rotaAtiva) atualizarRota(selTrip, selS);
      if (alvoSeguir) map.setCenter(alvoSeguir);
      FT.ultimas = features;
      const src = map.getSource('fertagus-trains');
      if (src && (features.length || FT.nFeat !== 0)) src.setData({ type: 'FeatureCollection', features });
      FT.nFeat = features.length;

      const parados = features.length - emCirculacao;
      if (emCirculacao !== FT.count || parados !== FT.parados) {
        FT.count = emCirculacao; FT.parados = parados; atualizarEstadoPainel();
      }
    }

    function iniciarAnimacaoFertagus() {
      cancelAnimationFrame(FT.rafId);
      if (activeOperator === 'fertagus' && FT.ready) FT.rafId = requestAnimationFrame(animarLoopFertagus);
    }

    // =====================================================================
    // RADAR CM — CARRIS METROPOLITANA
    // =====================================================================
    const CM = { trains: new Map(), features: [], dirty: true, error: null, rafId: null, poll: null, busy: false, last: 0 };
    const CM_POLL_MS = 5000;
    const CM_FRAME_MS = 1000 / 20;

    function iniciarRadarCM() {
      map.addSource('cm-trains', { type: 'geojson', buffer: 0, maxzoom: 12, data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'cm-trains-halo', type: 'circle', source: 'cm-trains', layout: { visibility: 'none' },
        paint: {
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 8, 3.5, 12, 7, 15, 11],
          'circle-color': ['coalesce', ['get', 'color'], '#facc15'],
          'circle-opacity': ['case', ['==', ['get', 'parado'], 1], 0.6, 1],
          'circle-stroke-width': 1.5, 'circle-stroke-color': '#f8fafc'
        }
      });
      map.addLayer({
        id: 'cm-trains-arrow', type: 'symbol', source: 'cm-trains', minzoom: 10,
        paint: { 'icon-opacity': ['case', ['==', ['get', 'rumo'], 1], 1, 0] },
        layout: {
          visibility: 'none', 'icon-image': 'train-arrow',
          'icon-size': ['interpolate', ['linear'], ['zoom'], 10, 0.25, 15, 0.5],
          'icon-rotate': ['get', 'bearing'], 'icon-rotation-alignment': 'map',
          'icon-allow-overlap': true, 'icon-ignore-placement': true
        }
      });
      map.addLayer({
        id: 'cm-trains-label', type: 'symbol', source: 'cm-trains', minzoom: 12,
        layout: { visibility: 'none', 'text-field': ['get', 'line'], 'text-size': 10, 'text-offset': [0, -1.3], 'text-anchor': 'bottom', 'text-allow-overlap': false },
        paint: { 'text-color': '#f8fafc', 'text-halo-color': '#090d16', 'text-halo-width': 2 }
      });

      map.on('mouseenter', 'cm-trains-halo', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'cm-trains-halo', () => { map.getCanvas().style.cursor = ''; });
      map.on('click', 'cm-trains-halo', (e) => { abrirPopupCM(e.features[0].properties, e.features[0].geometry.coordinates.slice()); });

      ligarCM(activeOperator === 'cm');
    }

    function lotacaoTexto(o) {
      return ({ EMPTY: 'Vazio', MANY_SEATS_AVAILABLE: 'Muitos lugares livres', FEW_SEATS_AVAILABLE: 'Poucos lugares livres', STANDING_ROOM_ONLY: 'Só em pé', CRUSHED_STANDING_ROOM_ONLY: 'Muito cheio', FULL: 'Cheio', NOT_ACCEPTING_PASSENGERS: 'Não aceita passageiros' })[o] || '';
    }

    function abrirPopupCM(p, coords) {
      const id = String(p.id);
      novoPopup({ offset: 12 })
        .setLngLat(coords)
        .setHTML(`
          <div style="font-size:0.72rem; text-transform:uppercase; color:#94a3b8; font-weight:700;">Carris Metropolitana · Linha ${esc(p.line)}</div>
          <div style="font-size:1.05rem; font-weight:800; color:#fff;">${esc(p.lineName || 'Linha ' + p.line)}</div>
          ${p.stopName ? `<div style="font-size:0.78rem; color:#cbd5e1;">${p.status === 'STOPPED_AT' ? 'Parado em' : 'A caminho de'} <b>${esc(p.stopName)}</b></div>` : ''}
          ${lotacaoTexto(p.occupancy) ? `<div style="font-size:0.78rem; color:#cbd5e1;">Lotação: ${esc(lotacaoTexto(p.occupancy))}</div>` : ''}
          <div style="font-size:0.7rem; color:#64748b; font-family:'JetBrains Mono',monospace;">Veículo ${esc(id)}</div>
          <button onclick="seguirComboio('cm','${esc(id)}',this)" style="margin-top:8px;width:100%;padding:5px 0;border:0;border-radius:6px;background:#facc15;color:#1a1400;font-weight:700;cursor:pointer">Seguir</button>
        `).addTo(map);

      SELECIONADO = { op: 'cm', id };
      carregarPercursoCM(id, p.pattern);
    }

    function carregarPercursoCM(id, pattern) {
      CP.rotaStops = null; CP.rotaPath = null; CP.rotaAt = null; CP.rotaChave = null; CP.rotaIdx = null;
      CP.rotaPattern = pattern;
      const vazio = { type: 'FeatureCollection', features: [] };
      if (map.getSource('rota-paragens')) map.getSource('rota-paragens').setData(vazio);
      if (map.getSource('rota-linha')) map.getSource('rota-linha').setData(vazio);
      if (!pattern) return;
      fetch(`${API_BASE}/api/buses/pattern/${encodeURIComponent(pattern)}`)
        .then(r => r.ok ? r.json() : null)
        .then(d => { if (d && SELECIONADO && SELECIONADO.op === 'cm' && SELECIONADO.id === id && CP.rotaPattern === pattern) CP.rotaStops = d.stops; })
        .catch(() => {});
    }

    function atualizarParagensCM(s) {
      const st = CP.rotaStops, p = map.getSource('rota-paragens');
      if (!st || !st.length || !p) return;
      const pr = s.feature.properties;
      let i = pr.stopId ? st.findIndex((x, k) => x.id === pr.stopId && k >= (CP.rotaIdx || 0)) : -1;
      if (i < 0 && pr.stopId) i = st.findIndex(x => x.id === pr.stopId);
      if (i < 0) {
        const k = Math.cos(s.lat * Math.PI / 180);
        let bd = Infinity;
        st.forEach((x, j) => {
          const dx = (x.lon - s.lon) * k, dy = x.lat - s.lat, d = dx * dx + dy * dy;
          if (d < bd) { bd = d; i = j; }
        });
      }
      if (pr.status === 'STOPPED_AT') i++;
      CP.rotaIdx = Math.max(0, i);
      const chave = SELECIONADO.id + ':' + i + ':' + st.length;
      if (CP.rotaChave === chave) return;
      CP.rotaChave = chave;
      p.setData({
        type: 'FeatureCollection',
        features: st.slice(Math.max(0, i)).map(x => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [x.lon, x.lat] }, properties: { label: x.name } }))
      });
    }

    function ligarCM(ativo) {
      const v = ativo ? 'visible' : 'none';
      ['cm-trains-halo', 'cm-trains-arrow', 'cm-trains-label'].forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', v); });
      cancelAnimationFrame(CM.rafId); clearInterval(CM.poll);
      if (!ativo) return;
      CM.dirty = true; atualizarCM(); CM.poll = setInterval(atualizarCM, CM_POLL_MS); CM.rafId = requestAnimationFrame(animarLoopCM);
    }

    async function atualizarCM() {
      if (CM.busy || document.hidden) return;
      CM.busy = true;
      try {
        const res = await fetch(`${API_BASE}/api/buses/vehicles`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const list = await res.json(), now = performance.now(), vistos = new Set();

        for (const t of list) {
          vistos.add(t.id);
          let s = CM.trains.get(t.id);
          if (!s) {
            s = {
              lon: t.lon, lat: t.lat, from: [t.lon, t.lat], to: [t.lon, t.lat],
              t0: now, dur: CM_POLL_MS, lastChange: now, mudancas: 0,
              bearing: t.heading ?? 0, alvoBearing: t.heading ?? 0, sabeRumo: t.heading != null,
              feature: { type: 'Feature', geometry: { type: 'Point', coordinates: [t.lon, t.lat] }, properties: {} }
            };
            CM.trains.set(t.id, s); CM.dirty = true;
          } else if (Math.abs(t.lon - s.to[0]) > 1e-6 || Math.abs(t.lat - s.to[1]) > 1e-6) {
            const origem = [s.lon, s.lat];
            const distKm = turf.distance(origem, [t.lon, t.lat], { units: 'kilometers' });
            if (distKm > 2) {
              s.lon = t.lon; s.lat = t.lat; s.from = [t.lon, t.lat]; s.to = [t.lon, t.lat]; s.t0 = now;
            } else {
              const intervalo = now - s.lastChange;
              s.dur = s.mudancas === 0 ? Math.max(2000, Math.min(30000, intervalo)) : Math.max(2000, Math.min(30000, s.dur * 0.5 + intervalo * 0.5));
              s.from = origem; s.to = [t.lon, t.lat]; s.t0 = now;
              if (t.heading == null && distKm > 0.01) { s.alvoBearing = turf.bearing(origem, s.to); s.sabeRumo = true; }
            }
            s.lastChange = now; s.mudancas++;
          }

          if (t.heading != null) { s.alvoBearing = t.heading; if (!s.sabeRumo) s.bearing = t.heading; s.sabeRumo = true; }

          const p = s.feature.properties;
          p.id = String(t.id); p.line = t.line || ''; p.lineName = t.lineName || ''; p.color = t.color || '';
          p.pattern = t.pattern || ''; p.status = t.status || ''; p.stopName = t.stopName || '';
          p.occupancy = t.occupancy || ''; p.parado = t.stopped ? 1 : 0; p.bearing = s.bearing; p.stopId = t.stop || '';
          const rumo = s.sabeRumo ? 1 : 0;
          if (p.rumo !== rumo) { p.rumo = rumo; CM.dirty = true; }
        }

        for (const id of [...CM.trains.keys()]) { if (!vistos.has(id)) { CM.trains.delete(id); CM.dirty = true; } }
        if (CM.dirty) CM.features = [...CM.trains.values()].map(s => s.feature);
        CM.error = null;
      } catch (err) { CM.error = err.message || String(err); console.error("Erro feed Carris:", err); } 
      finally { CM.busy = false; atualizarEstadoPainel(); }
    }

    function animarLoopCM(ts) {
      if (activeOperator !== 'cm') return;
      CM.rafId = requestAnimationFrame(animarLoopCM);
      if (ts - CM.last < CM_FRAME_MS) return;
      const dt = Math.min(0.25, (ts - CM.last) / 1000); CM.last = ts;

      const now = performance.now();
      const kRot = 1 - Math.exp(-dt / 0.3);
      let alterou = CM.dirty, alvoSeguir = null;

      for (const s of CM.trains.values()) {
        const f = Math.max(0, Math.min(1, (now - s.t0) / s.dur));
        const lon = s.from[0] + (s.to[0] - s.from[0]) * f, lat = s.from[1] + (s.to[1] - s.from[1]) * f;
        const bearing = suavizarAngulo(s.bearing, s.alvoBearing, kRot);
        if (SEGUIR && SEGUIR.op === 'cm' && SEGUIR.id === s.feature.properties.id) alvoSeguir = [lon, lat];

        if (lon !== s.lon || lat !== s.lat || Math.abs(bearing - s.bearing) > 0.05) {
          s.lon = lon; s.lat = lat; s.bearing = bearing;
          s.feature.geometry.coordinates[0] = lon; s.feature.geometry.coordinates[1] = lat;
          s.feature.properties.bearing = bearing; alterou = true;
        }
      }

      if (SELECIONADO && SELECIONADO.op === 'cm') {
        const sel = CM.trains.get(SELECIONADO.id);
        if (!sel) { SELECIONADO = null; limparRota(); }
        else {
          const pat = sel.feature.properties.pattern;
          if (pat && pat !== CP.rotaPattern) carregarPercursoCM(SELECIONADO.id, pat);
          else if (CP.rotaStops) atualizarParagensCM(sel);
        }
      }
      if (alvoSeguir) map.setCenter(alvoSeguir);
      if (alterou) {
        CM.dirty = false;
        const src = map.getSource('cm-trains');
        if (src) src.setData({ type: 'FeatureCollection', features: CM.features });
      }
    }


    // =====================================================================
    // RADAR CP
    // =====================================================================
    const CP = { trains: new Map(), features: [], dirty: true, error: null, rafId: null, poll: null, busy: false, last: 0 };
    const CP_POLL_MS = 4000;

    function normNome(t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
    function hhmm(t) { const m = /(\d{1,2}:\d{2})/.exec(String(t || '')); return m ? m[1] : ''; }

    function rumoInicial(s, t) {
      if (t.heading) { s.alvoBearing = s.bearing = t.heading; s.sabeRumo = true; return; }
      const d = CP.estacoes && CP.estacoes.get(normNome(t.destination));
      if (d) { s.alvoBearing = s.bearing = turf.bearing([s.lon, s.lat], d); s.sabeRumo = true; }
    }

    function atualizarRotaCaminho(s, l, p) {
      const agora = performance.now();
      if (agora - (CP.rotaT || 0) < 250) return;
      CP.rotaT = agora;
      const path = CP.rotaPath, k = Math.cos(s.lat * Math.PI / 180);
      const procurar = (lo, hi) => {
        let b = lo, bd = Infinity;
        for (let i = lo; i <= hi; i++) {
          const dx = (path[i][0] - s.lon) * k, dy = path[i][1] - s.lat, d = dx * dx + dy * dy;
          if (d < bd) { bd = d; b = i; }
        }
        return [b, bd];
      };
      const h = CP.rotaIdx;
      let [j, bd] = h == null ? procurar(0, path.length - 1) : procurar(Math.max(0, h - 300), Math.min(path.length - 1, h + 300));
      if (bd > 4e-4 && h != null) [j, bd] = procurar(0, path.length - 1);
      if (j < path.length - 1) {
        const a = path[j], b = path[j + 1];
        if ((b[0] - a[0]) * k * (s.lon - a[0]) * k + (b[1] - a[1]) * (s.lat - a[1]) > 0) j++;
      }
      CP.rotaIdx = j;
      l.setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [[s.lon, s.lat], ...path.slice(j)] } });

      const st = CP.rotaStops, at = CP.rotaAt;
      const rest = st.filter((x, i) => {
        if (at[i] > j) return true;
        if (at[i] < j) return false;
        const dx = (path[j][0] - s.lon) * k, dy = path[j][1] - s.lat;
        return dx * dx + dy * dy > 1e-6;
      });
      const chave = SELECIONADO.id + ':' + rest.length;
      if (CP.rotaChave !== chave) {
        CP.rotaChave = chave;
        p.setData({ type: 'FeatureCollection', features: rest.map(x => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [x.lon, x.lat] }, properties: { label: `${x.name} ${hhmm(x.time)}`.trim() } })) });
      }
    }

    function atualizarRotaCP(s) {
      const st = CP.rotaStops;
      const l = map.getSource('rota-linha'), p = map.getSource('rota-paragens');
      if (!st || st.length < 2 || !l || !p) return;
      if (CP.rotaPath && CP.rotaPath.length > 1 && CP.rotaAt) { atualizarRotaCaminho(s, l, p); return; }
      const k = Math.cos(s.lat * Math.PI / 180);
      let melhor = 0, dMin = Infinity, tMelhor = 0;
      for (let i = 0; i < st.length - 1; i++) {
        const ax = st[i].lon * k, ay = st[i].lat, bx = st[i + 1].lon * k, by = st[i + 1].lat;
        const dx = bx - ax, dy = by - ay, px = s.lon * k - ax, py = s.lat - ay;
        const t = Math.max(0, Math.min(1, (px * dx + py * dy) / (dx * dx + dy * dy || 1)));
        const d = Math.hypot(px - t * dx, py - t * dy);
        if (d < dMin) { dMin = d; melhor = i; tMelhor = t; }
      }
      const idx = (melhor === 0 && tMelhor === 0) ? 0 : melhor + 1;
      const restantes = st.slice(idx);
      l.setData({ type: 'Feature', geometry: { type: 'LineString', coordinates: [[s.lon, s.lat], ...restantes.map(x => [x.lon, x.lat])] } });
      const chave = SELECIONADO.id + ':' + idx;
      if (CP.rotaChave !== chave) {
        CP.rotaChave = chave;
        p.setData({ type: 'FeatureCollection', features: restantes.map(x => ({ type: 'Feature', geometry: { type: 'Point', coordinates: [x.lon, x.lat] }, properties: { label: `${x.name} ${hhmm(x.time)}`.trim() } })) });
      }
    }

    function esc(t) { return String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
    function textoAtraso(m) { return m >= 1 ? `<span style="color:${m >= 6 ? '#f87171' : '#fbbf24'}">${m} min de atraso</span>` : '<span style="color:#4ade80">Sem atraso</span>'; }

    function iniciarRadarCP() {
      map.addSource('cp-trains', { type: 'geojson', buffer: 0, maxzoom: 12, data: { type: 'FeatureCollection', features: [] } });
      map.addLayer({
        id: 'cp-trains-halo', type: 'circle', source: 'cp-trains',
        paint: {
          'circle-radius': ['interpolate', ['linear'], ['zoom'], 6, 5, 10, 8, 14, 13],
          'circle-color': ['case', ['>=', ['get', 'delayMin'], 6], '#ef4444', ['>=', ['get', 'delayMin'], 1], '#f59e0b', '#4ade80'],
          'circle-stroke-width': 2, 'circle-stroke-color': '#06080e'
        }
      });
      map.addLayer({
        id: 'cp-trains-arrow', type: 'symbol', source: 'cp-trains',
        paint: { 'icon-opacity': ['case', ['==', ['get', 'rumo'], 1], 1, 0] },
        layout: {
          'icon-image': 'train-arrow', 'icon-size': ['interpolate', ['linear'], ['zoom'], 6, 0.3, 10, 0.45, 14, 0.6],
          'icon-rotate': ['get', 'bearing'], 'icon-rotation-alignment': 'map', 'icon-allow-overlap': true, 'icon-ignore-placement': true
        }
      });
      map.addLayer({
        id: 'cp-trains-label', type: 'symbol', source: 'cp-trains', minzoom: 9,
        layout: { 'text-field': ['get', 'id'], 'text-size': 11, 'text-offset': [0, -1.5], 'text-anchor': 'bottom', 'text-allow-overlap': false },
        paint: { 'text-color': '#f8fafc', 'text-halo-color': '#090d16', 'text-halo-width': 2 }
      });

      map.on('mouseenter', 'cp-trains-halo', () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', 'cp-trains-halo', () => { map.getCanvas().style.cursor = ''; });
      map.on('click', 'cp-trains-halo', (e) => { abrirPopupCP(e.features[0].properties, e.features[0].geometry.coordinates.slice()); });

      ligarCP(activeOperator === 'cp');
    }

    function abrirPopupCP(p, coords) {
      const rota = p.origin && p.destination ? `${esc(p.origin)} → ${esc(p.destination)}` : '';
      novoPopup({ offset: 14 })
        .setLngLat(coords)
        .setHTML(`
          <div style="font-size:0.72rem; text-transform:uppercase; color:#94a3b8; font-weight:700;">CP${p.service ? ' · ' + esc(p.service) : ''}</div>
          <div style="font-size:1.05rem; font-weight:800; color:#fff;">Comboio ${esc(p.id)}</div>
          ${rota ? `<div style="font-size:0.78rem; color:#cbd5e1;">${rota}</div>` : ''}
          <div style="font-size:0.78rem;">${textoAtraso(Number(p.delayMin))}</div>
        <button onclick="seguirComboio('cp','${esc(p.id)}',this)" style="margin-top:8px;width:100%;padding:5px 0;border:0;border-radius:6px;background:#38bdf8;color:#06080e;font-weight:700;cursor:pointer">Seguir</button>
`).addTo(map);
      const id = String(p.id);
      SELECIONADO = { op: 'cp', id };
      CP.rotaStops = null; CP.rotaPath = null; CP.rotaAt = null; CP.rotaChave = null;
      fetch(`${API_BASE}/api/trains/cp/${encodeURIComponent(id)}/stops`)
        .then(r => r.ok ? r.json() : null)
        .then(d => {
          if (d && SELECIONADO && SELECIONADO.op === 'cp' && SELECIONADO.id === id) {
            CP.rotaStops = d.stops; CP.rotaPath = d.path; CP.rotaAt = d.stopAt; CP.rotaIdx = null;
          }
        }).catch(() => {});
    }

    function ligarCP(ativo) {
      const v = ativo ? 'visible' : 'none';
      ['cp-trains-halo', 'cp-trains-arrow', 'cp-trains-label'].forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', v); });
      cancelAnimationFrame(CP.rafId); clearInterval(CP.poll);
      if (!ativo) return;
      CP.dirty = true; atualizarCP(); CP.poll = setInterval(atualizarCP, CP_POLL_MS); CP.rafId = requestAnimationFrame(animarLoopCP);
    }

    async function atualizarCP() {
      if (CP.busy || document.hidden) return;
      CP.busy = true;
      try {
        const res = await fetch(`${API_BASE}/api/trains/cp`, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const list = await res.json(), now = performance.now(), vistos = new Set();

        for (const t of list) {
          vistos.add(t.id);
          let s = CP.trains.get(t.id);

          if (!s) {
            s = {
              lon: t.lon, lat: t.lat, from: [t.lon, t.lat], to: [t.lon, t.lat],
              t0: now, dur: CP_POLL_MS, lastChange: now, mudancas: 0, sabeRumo: false, temMov: false,
              bearing: t.heading ?? 0, alvoBearing: t.heading ?? 0,
              feature: { type: 'Feature', geometry: { type: 'Point', coordinates: [t.lon, t.lat] }, properties: {} }
            };
            CP.trains.set(t.id, s); CP.dirty = true;
          } else if (Math.abs(t.lon - s.to[0]) > 1e-6 || Math.abs(t.lat - s.to[1]) > 1e-6) {
            const origem = [s.lon, s.lat];
            const distKm = turf.distance(origem, [t.lon, t.lat], { units: 'kilometers' });

            if (distKm > 5) {
              s.lon = t.lon; s.lat = t.lat; s.from = [t.lon, t.lat]; s.to = [t.lon, t.lat]; s.t0 = now;
            } else {
              const intervalo = now - s.lastChange;
              s.dur = s.mudancas === 0 ? Math.max(2000, Math.min(30000, intervalo)) : Math.max(2000, Math.min(30000, s.dur * 0.5 + intervalo * 0.5));
              s.from = origem; s.to = [t.lon, t.lat]; s.t0 = now;
              if (t.heading == null && distKm > 0.02) { s.alvoBearing = turf.bearing(origem, s.to); s.sabeRumo = true; s.temMov = true; }
            }
            s.lastChange = now; s.mudancas++;
          }

          if (t.heading != null) { s.alvoBearing = t.heading; if (!s.sabeRumo) s.bearing = t.heading; s.sabeRumo = true; }
          else if (!s.sabeRumo) rumoInicial(s, t);
          
          const p = s.feature.properties;
          p.id = String(t.id); p.delayMin = t.delayMin || 0; p.service = t.service || '';
          p.origin = t.origin || ''; p.destination = t.destination || ''; p.bearing = s.bearing;
          const rumo = s.sabeRumo ? 1 : 0;
          if (p.rumo !== rumo) { p.rumo = rumo; CP.dirty = true; }
        }

        for (const id of [...CP.trains.keys()]) { if (!vistos.has(id)) { CP.trains.delete(id); CP.dirty = true; } }
        if (CP.dirty) CP.features = [...CP.trains.values()].map(s => s.feature);
        CP.error = null;
      } catch (err) {
        CP.error = err.message || String(err); console.error("Erro no feed CP:", err);
      } finally { CP.busy = false; atualizarEstadoPainel(); }
    }

    function animarLoopCP(ts) {
      if (activeOperator !== 'cp') return;
      CP.rafId = requestAnimationFrame(animarLoopCP);
      if (ts - CP.last < FRAME_MS) return;
      const dt = Math.min(0.25, (ts - CP.last) / 1000); CP.last = ts;

      const now = performance.now();
      const kRot = 1 - Math.exp(-dt / 0.3);
      let alterou = CP.dirty, alvoSeguir = null;

      for (const s of CP.trains.values()) {
        const f = Math.max(0, Math.min(1, (now - s.t0) / s.dur));
        const lon = s.from[0] + (s.to[0] - s.from[0]) * f, lat = s.from[1] + (s.to[1] - s.from[1]) * f;
        const bearing = suavizarAngulo(s.bearing, s.alvoBearing, kRot);
        if (SEGUIR && SEGUIR.op === 'cp' && SEGUIR.id === s.feature.properties.id) alvoSeguir = [lon, lat];

        if (lon !== s.lon || lat !== s.lat || Math.abs(bearing - s.bearing) > 0.05) {
          s.lon = lon; s.lat = lat; s.bearing = bearing;
          s.feature.geometry.coordinates[0] = lon; s.feature.geometry.coordinates[1] = lat;
          s.feature.properties.bearing = bearing; alterou = true;
        }
      }

      if (SELECIONADO && SELECIONADO.op === 'cp') {
        const sel = CP.trains.get(SELECIONADO.id);
        if (sel) atualizarRotaCP(sel); else { SELECIONADO = null; limparRota(); }
      }
      if (alvoSeguir) map.setCenter(alvoSeguir);
      if (alterou) {
        CP.dirty = false;
        const src = map.getSource('cp-trains');
        if (src) src.setData({ type: 'FeatureCollection', features: CP.features });
      }
    }

    // =====================================================================
    // LISTA E PAINEL
    // =====================================================================
    const LISTA = { html: '', titulo: '', filtro: '', ordem: 'num' };

    function construirLista() {
      const q = LISTA.filtro, casa = txt => !q || txt.toLowerCase().includes(q);
      let html = '', total = 0;

      if (activeOperator === 'cm') {
        const todos = [...CM.trains.values()].map(s => s.feature.properties)
          .filter(p => casa(`${p.id} ${p.line} ${p.lineName} ${p.stopName}`))
          .sort((a, b) => (LISTA.ordem === 'estado' ? a.parado - b.parado : 0)
            || String(a.line).localeCompare(String(b.line), 'pt', { numeric: true }) || String(a.id).localeCompare(String(b.id)));
        total = todos.length;
        html = todos.slice(0, 250).map(p => `
          <div class="train-row${p.parado ? ' parked' : ''}" data-id="${esc(p.id)}">
            <span class="tr-dot" style="background:${esc(p.color || '#facc15')}"></span>
            <span class="tr-id">${esc(p.line)}</span>
            <div class="tr-main">
              <div class="tr-route">${esc(p.lineName || 'Linha ' + p.line)}</div>
              <div class="tr-sub">${p.stopName ? (p.status === 'STOPPED_AT' ? 'Parado em ' : '→ ') + esc(p.stopName) : esc(p.id)}</div>
            </div>
          </div>`).join('');
        if (total > 250) html += `<div class="tr-empty">A mostrar 250 de ${total}. Usa o filtro para encontrar uma linha.</div>`;
      } else if (activeOperator === 'fertagus') {
        const ps = FT.ultimas.map(f => f.properties).filter(p => casa(`${p.id} ${p.dest} ${p.next} ${p.status}`))
          .sort((a, b) => (a.estac - b.estac) || (LISTA.ordem === 'estado' ? String(a.eta).localeCompare(String(b.eta)) : 0) || (Number(a.id) - Number(b.id)));
        total = ps.length;
        html = ps.map(p => `
          <div class="train-row${p.estac ? ' parked' : ''}" data-id="${esc(p.id)}">
            <span class="tr-dot" style="background:${p.dir === 'sul' ? '#0ea5e9' : '#10b981'}"></span>
            <span class="tr-id">${esc(p.id)}</span>
            <div class="tr-main">
              <div class="tr-route">→ ${esc(p.dest)}</div>
              <div class="tr-sub">${esc(p.status)}</div>
            </div>
            ${p.estac || !p.eta ? '' : `<span class="tr-time"><small style="display:block;font-size:0.55rem;color:#64748b;font-weight:600">CHEGA</small>${esc(p.eta)}</span>`}
          </div>`).join('');
      } else {
        const ps = [...CP.trains.values()].map(s => s.feature.properties).filter(p => casa(`${p.id} ${p.origin} ${p.destination} ${p.service}`))
          .sort((a, b) => (LISTA.ordem === 'estado' ? (b.delayMin || 0) - (a.delayMin || 0) : 0) || Number(a.id) - Number(b.id) || String(a.id).localeCompare(String(b.id))).slice(0, 400);
        total = ps.length;
        html = ps.map(p => {
          const m = p.delayMin || 0, cor = m >= 6 ? '#ef4444' : m >= 1 ? '#f59e0b' : '#4ade80';
          return `
          <div class="train-row" data-id="${esc(p.id)}">
            <span class="tr-dot" style="background:${cor}"></span>
            <span class="tr-id">${esc(p.id)}</span>
            <div class="tr-main">
              <div class="tr-route">${p.origin && p.destination ? esc(p.origin) + ' → ' + esc(p.destination) : esc(p.service || 'Comboio')}</div>
              <div class="tr-sub">${esc(p.service)}</div>
            </div>
            <span class="tr-badge" style="color:${cor}; background:${cor}22">${m >= 1 ? '+' + m + ' min' : '✓'}</span>
          </div>`;
        }).join('');
      }
      return { html: html || '<div class="tr-empty">Sem comboios de momento</div>', total };
    }

    function atualizarLista() {
      if (document.hidden || painel.classList.contains('collapsed')) return;
      const { html, total } = construirLista();
      const lista = document.getElementById('trainList');
      if (LISTA.html !== html) { lista.innerHTML = html; LISTA.html = html; }
      const titulo = `Ativos · ${total}`;
      if (LISTA.titulo !== titulo) { document.getElementById('listaTitulo').textContent = titulo; LISTA.titulo = titulo; }
    }

    function focarComboio(id) {
      if (window.innerWidth <= 768 && !painel.classList.contains('collapsed')) definirRecolhido(true);
      
      if (activeOperator === 'cm') {
        const s = CM.trains.get(id);
        if (!s) return;
        map.flyTo({ center: [s.lon, s.lat], zoom: Math.max(map.getZoom(), 13), speed: 1.6, padding: paddingPT() });
        abrirPopupCM(s.feature.properties, [s.lon, s.lat]);
      } else if (activeOperator === 'fertagus') {
        const f = FT.ultimas.find(x => x.properties.id === id);
        if (!f) return;
        map.flyTo({ center: f.geometry.coordinates, zoom: Math.max(map.getZoom(), 12), speed: 1.6, padding: paddingPT() });
        abrirPopupFertagus(f.properties, f.geometry.coordinates.slice());
      } else {
        const s = CP.trains.get(id);
        if (!s) return;
        map.flyTo({ center: [s.lon, s.lat], zoom: Math.max(map.getZoom(), 11), speed: 1.6, padding: paddingPT() });
        abrirPopupCP(s.feature.properties, [s.lon, s.lat]);
      }
    }

    document.getElementById('trainList').addEventListener('click', (ev) => {
      const row = ev.target.closest('.train-row');
      if (row) focarComboio(row.dataset.id);
    });
    document.getElementById('filtroLista').addEventListener('input', (ev) => { LISTA.filtro = ev.target.value.trim().toLowerCase(); atualizarLista(); });
    document.getElementById('ordemLista').addEventListener('change', (ev) => { LISTA.ordem = ev.target.value; atualizarLista(); });

    const painel = document.getElementById('painelGlobal');
    const btnRecolher = document.getElementById('btnRecolher');
    const headerDrag = document.getElementById('headerDrag');
    const sheetHandle = document.querySelector('.sheet-handle');
    
    function definirRecolhido(r) {
      painel.classList.toggle('collapsed', r);
      if (window.innerWidth <= 768) {
        document.body.classList.toggle('sheet-collapsed', r);
        document.body.classList.toggle('sheet-open', !r);
      }
      if (!r) atualizarLista();
      map.easeTo({ padding: paddingPT(), duration: 350 });
    }
    
    btnRecolher.addEventListener('click', (e) => {
      e.stopPropagation();
      definirRecolhido(!painel.classList.contains('collapsed'));
    });
    
    // Clique simples no título
    headerDrag.addEventListener('click', () => {
      if (window.innerWidth <= 768) definirRecolhido(!painel.classList.contains('collapsed'));
    });

    // --- Lógica de Arrastar (Swipe) no Telemóvel ---
    let touchStartY = 0;
    let touchCurrentY = 0;

    function onTouchStart(e) { 
      touchStartY = e.touches[0].clientY; 
    }
    
    function onTouchMove(e) { 
      touchCurrentY = e.touches[0].clientY; 
    }
    
    function onTouchEnd() {
      if (!touchStartY || !touchCurrentY || window.innerWidth > 768) return;
      
      const deltaY = touchCurrentY - touchStartY;
      
      // Margem de segurança de 40px para não disparar por acidente
      if (deltaY > 40) {
        definirRecolhido(true); // Arrastou para baixo -> Recolhe
      } else if (deltaY < -40) {
        definirRecolhido(false); // Arrastou para cima -> Expande
      }
      
      touchStartY = 0; 
      touchCurrentY = 0;
    }

    // Lista específica das zonas onde o utilizador pode arrastar a gaveta
    const zonasDeArrasto = [
      document.querySelector('.sheet-handle'),
      document.getElementById('headerDrag'),
      document.querySelector('.operator-toggle'),
      document.querySelector('.list-head')
    ];

    zonasDeArrasto.forEach(el => {
      if(el) {
        el.addEventListener('touchstart', (e) => { onTouchStart(e); }, { passive: true });
        el.addEventListener('touchmove', (e) => { 
          // Se estiver a tocar no input de pesquisa ou na dropdow, permite o comportamento nativo
          if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
          
          e.preventDefault(); // Bloqueia o refresh da página
          onTouchMove(e); 
        }, { passive: false });
        el.addEventListener('touchend', onTouchEnd);
      }
    });

    if (window.innerWidth <= 768) {
      definirRecolhido(true);
    } else {
      document.body.classList.add('sheet-collapsed');
    }

    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && popupAtual) popupAtual.remove(); });
    setInterval(atualizarLista, 1000);

function atualizarEstadoPainel() {
      const el = document.getElementById('liveStatus'); 
      let html;
      
      if (activeOperator === 'fertagus') {
        html = FT.error 
          ? 'Sem ligação ao servidor' 
          : FT.ready 
            ? `<b>${Math.max(0, FT.count)}</b> em circulação${FT.parados ? ` · ${FT.parados} no terminal` : ''}` 
            : 'A carregar horários…';
      } else if (activeOperator === 'cm') {
        html = CM.error 
          ? 'Feed Carris indisponível:<br>' + esc(CM.error) 
          : `<b>${CM.trains.size}</b> autocarros com posição`;
      } else {
        html = CP.error 
          ? 'Feed CP indisponível:<br>' + esc(CP.error) 
          : `<b>${CP.trains.size}</b> comboios com posição`;
      }
      
      if (el._html !== html) { el.innerHTML = html; el._html = html; }
    }
      
      // Esconde o espaço do texto se não houver erro nenhum
      el.style.display = html === '' ? 'none' : 'block';
      if (el._html !== html) { el.innerHTML = html; el._html = html; }
    }

    function mostrarComboiosFertagus(visivel) {
      const v = visivel ? 'visible' : 'none';
      ['fertagus-track-line', 'fertagus-trains-halo', 'fertagus-trains-arrow', 'fertagus-trains-label'].forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', v); });
    }

    async function carregarEstacoes() {
      if (activeOperator === 'cm') {
        if (map.getSource('stations')) map.getSource('stations').setData({ type: 'FeatureCollection', features: [] });
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/api/stations?operator=${activeOperator}`);
        const stations = await res.json();
        const geojson = {
          type: "FeatureCollection",
          features: stations.filter(s => s.lat && s.lon && !isNaN(s.lat) && !isNaN(s.lon)).map(s => ({
            type: "Feature", geometry: { type: "Point", coordinates: [Number(s.lon), Number(s.lat)] },
            properties: { name: s.name, code: s.code || "", operator: activeOperator }
          }))
        };
        if (activeOperator === 'cp') CP.estacoes = new Map(stations.map(s => [normNome(s.name), [Number(s.lon), Number(s.lat)]]));
        if (map.getSource('stations')) map.getSource('stations').setData(geojson);
      } catch (err) { console.error("Erro ao obter estações:", err); }
    }

    function selecionarOperador(op) {
      if (activeOperator === op) return;
      activeOperator = op;
      
      const botoes = { cp: 'btnCP', fertagus: 'btnFT', cm: 'btnCM' };
      for (const k in botoes) {
        document.getElementById(botoes[k]).className = k === op ? `btn-op active ${k}` : 'btn-op';
      }

      if (op === 'fertagus') {
        map.flyTo({ center: [-9.05, 38.66], zoom: 10, speed: 1.4, padding: paddingPT() });
      } else if (op === 'cm') {
        map.flyTo({ center: [-9.05, 38.75], zoom: 9.3, speed: 1.4, padding: paddingPT() });
      } else {
        map.fitBounds(PT_BOUNDS, { padding: paddingPT(), duration: 1500 });
      }

      mostrarComboiosFertagus(op === 'fertagus');
      ligarCP(op === 'cp');
      ligarCM(op === 'cm');
      
      if (op === 'fertagus') iniciarAnimacaoFertagus(); else cancelAnimationFrame(FT.rafId);

      SEGUIR = null; SELECIONADO = null;
      if (popupAtual) popupAtual.remove();
      limparRota(); atualizarEstadoPainel(); atualizarLista(); carregarEstacoes();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) return;
      if (activeOperator === 'cp') ligarCP(true);
      else if (activeOperator === 'cm') ligarCM(true);
      else iniciarAnimacaoFertagus();
    });
  </script>
</body>
</html>
